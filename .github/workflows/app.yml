name: temporary-crossover-copy-fix-dmg

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27
        run: sudo xcode-select -s /Applications/Xcode_27.0.app

      - name: Build patched app from v1.2.3 sources
        run: |
          set -euo pipefail
          mkdir -p /tmp/release
          curl -L --fail --silent --show-error \
            https://github.com/NotProtonNot/NotProton/releases/download/v1.2.3/NotProton.zip \
            -o /tmp/NotProton.zip
          echo '12a9b01657c6488f4c223ddd0b4324266f3a8eddeabded216f29700bc83c45b1  /tmp/NotProton.zip' | shasum -a 256 -c -
          ditto -x -k /tmp/NotProton.zip /tmp/release
          swift build --package-path app -c release
          bin="$(swift build --package-path app -c release --show-bin-path)"
          app=/tmp/release/NotProton.app
          resources="$app/Contents/Resources/NotProtonApp_NotProtonApp.bundle/Contents/Resources"
          cp "$bin/NotProtonApp" "$app/Contents/MacOS/NotProtonApp"
          install_name_tool -add_rpath @executable_path/../Frameworks "$app/Contents/MacOS/NotProtonApp"
          mkdir -p "$resources"
          cp -R "$bin/NotProtonApp_NotProtonApp.bundle/Contents/Resources/." "$resources/"
          for lproj in "$bin/NotProtonApp_NotProtonApp.bundle/Contents/Resources/"*.lproj; do
            [ -d "$lproj" ] || continue
            ditto "$lproj" "$app/Contents/Resources/$(basename "$lproj")"
          done
          codesign -f -s - "$app"
          codesign --verify --strict "$app"

      - name: Create and verify DMG
        run: |
          set -euo pipefail
          mkdir -p /tmp/dmg out/artifact
          cp -R /tmp/release/NotProton.app /tmp/dmg/
          ln -s /Applications /tmp/dmg/Applications
          hdiutil create -volname 'NotProton 1.2.3 CrossOver copy fix' \
            -srcfolder /tmp/dmg -ov -format UDZO \
            out/artifact/NotProton-1.2.3-CrossOver-copy-fix.dmg
          hdiutil verify out/artifact/NotProton-1.2.3-CrossOver-copy-fix.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: NotProton-1.2.3-CrossOver-copy-fix
          path: out/artifact/NotProton-1.2.3-CrossOver-copy-fix.dmg
          if-no-files-found: error
          retention-days: 14
